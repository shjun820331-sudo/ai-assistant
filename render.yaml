# Render 배포 설정 (백엔드)
services:
  - type: web
    name: ai-assistant-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ALLOWED_ORIGINS
        value: https://ai-assistant-frontend-mauve.vercel.app,http://localhost:5500
      # 아래 두 값은 비밀이라 Render 화면에서 직접 입력한다.
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
